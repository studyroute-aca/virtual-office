<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Route A.C.A. — 運営オフィス</title>
<style>
  :root {
    --bg: #F5F3EE;
    --bg-grad-a: #F7F4EE;
    --bg-grad-b: #EEEAE1;
    --floor: #EFEAE0;
    --floor-line: #E0D9CB;
    --wall: #CBC2AF;
    --desk: #FFFDF9;
    --desk-border: #C4B9A3;
    --accent: #2F4A6B;
    --accent-soft: #E1E9F1;
    --accent-2: #B5673C;
    --accent-2-soft: #F3E3D6;
    --text: #26241E;
    --text-soft: #85806F;
    --ok: #4F7A5C;
    --warn: #B98A3B;
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", serif;

    --zone-marketing: #F7EFE3;
    --zone-content: #EAF0EC;
    --zone-finance: #EBEEF3;
    --zone-support: #F5EAE7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background:
      radial-gradient(ellipse 1200px 700px at 15% -10%, rgba(181,103,60,0.06), transparent),
      radial-gradient(ellipse 1000px 800px at 100% 110%, rgba(47,74,107,0.07), transparent),
      linear-gradient(160deg, var(--bg-grad-a), var(--bg-grad-b));
    background-attachment: fixed;
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    letter-spacing: 0.01em;
    height: 100%;
    overflow: hidden;
  }

  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap');

  .app {
    display: flex;
    height: 100vh;
  }

  /* ---- ヘッダー ---- */
  .header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 36px;
    background: rgba(247,244,238,0.82);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--wall);
    z-index: 20;
  }

  .header .title-block {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .header .title {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .header .subtitle {
    color: var(--text-soft);
    font-weight: 400;
    font-size: 12px;
    letter-spacing: 0.03em;
    padding-left: 14px;
    border-left: 1px solid var(--wall);
  }

  .header .date {
    font-size: 12px;
    color: var(--text-soft);
    letter-spacing: 0.02em;
  }

  /* ---- メインエリア（オフィス平面図） ---- */
  .office-wrap {
    flex: 1;
    margin-top: 72px;
    margin-right: 380px;
    height: calc(100vh - 72px);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 48px;
  }

  .office {
    position: relative;
    width: 920px;
    height: 640px;
    background:
      linear-gradient(var(--floor-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--floor-line) 1px, transparent 1px),
      var(--floor);
    background-size: 40px 40px, 40px 40px, 100% 100%;
    background-position: -1px -1px;
    border: 1px solid var(--wall);
    border-radius: 2px;
    box-shadow:
      0 1px 2px rgba(36,35,31,0.05),
      0 20px 48px rgba(47,74,107,0.09);
    flex-shrink: 0;
  }

  /* 部署エリアの区切り線 */
  .zone {
    position: absolute;
    border: 1px solid var(--wall);
    border-radius: 2px;
    background: rgba(255,255,255,0.4);
  }

  .zone.marketing { background: var(--zone-marketing); }
  .zone.content   { background: var(--zone-content); }
  .zone.finance   { background: var(--zone-finance); }
  .zone.support   { background: var(--zone-support); }

  .zone-label {
    position: absolute;
    top: 12px;
    left: 16px;
    font-family: var(--serif);
    font-size: 12.5px;
    color: var(--text);
    font-weight: 600;
    letter-spacing: 0.06em;
  }

  .zone-label::after {
    content: "";
    display: block;
    width: 20px;
    height: 1px;
    background: var(--accent);
    margin-top: 6px;
    opacity: 0.5;
  }

  /* デスク */
  .desk {
    position: absolute;
    width: 112px;
    height: 62px;
    background: var(--desk);
    border: 1px solid var(--desk-border);
    border-radius: 2px;
    box-shadow:
      0 2px 4px rgba(36,35,31,0.05),
      0 6px 14px rgba(36,35,31,0.05);
  }

  .desk::after {
    /* 天板の奥行きライン */
    content: "";
    position: absolute;
    left: 8px;
    right: 8px;
    top: 8px;
    height: 1px;
    background: var(--floor-line);
  }

  .desk::before {
    /* 椅子 */
    content: "";
    position: absolute;
    width: 28px;
    height: 20px;
    background: var(--wall);
    border-radius: 4px;
    bottom: -24px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0.45;
  }

  .staff {
    position: absolute;
    top: -17px;
    left: 50%;
    transform: translateX(-50%);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent-soft);
    border: 1.5px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    user-select: none;
    box-shadow: 0 2px 6px rgba(36,35,31,0.08);
  }

  .staff:hover {
    transform: translateX(-50%) scale(1.08);
    box-shadow: 0 4px 14px rgba(47,74,107,0.22);
  }

  .staff.selected {
    box-shadow: 0 0 0 4px rgba(47,74,107,0.15), 0 4px 14px rgba(47,74,107,0.22);
  }

  .status-dot {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 2px solid var(--floor);
  }

  .status-dot.working { background: var(--ok); }
  .status-dot.waiting { background: var(--warn); }
  .status-dot.done { background: var(--text-soft); }

  .desk-name {
    position: absolute;
    bottom: -42px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--text-soft);
    white-space: nowrap;
  }

  /* CPO席 */
  .cpo-desk {
    position: absolute;
    width: 130px;
    height: 74px;
    background: var(--desk);
    border: 1.5px solid var(--accent-2);
    border-radius: 4px;
    box-shadow:
      0 2px 4px rgba(36,35,31,0.05),
      0 8px 18px rgba(181,103,60,0.12);
  }

  .cpo-label {
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent-2);
    color: white;
    font-family: var(--serif);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 4px 12px;
    border-radius: 2px;
    white-space: nowrap;
  }

  /* ---- サイドパネル ---- */
  .panel {
    position: fixed;
    top: 72px;
    right: 380px;
    width: 340px;
    height: calc(100vh - 72px);
    background: #FFFDFA;
    border-left: 1px solid var(--wall);
    box-shadow: -16px 0 40px rgba(47,74,107,0.08);
    transform: translateX(100%);
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 25;
    padding: 34px 30px;
    overflow-y: auto;
  }

  .panel.open {
    transform: translateX(0);
  }

  .panel-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: none;
    font-size: 18px;
    color: var(--text-soft);
    cursor: pointer;
    line-height: 1;
  }

  .panel-avatar {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--accent-soft);
    border: 1.5px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 16px;
  }

  .panel-name {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }

  .panel-role {
    font-size: 12.5px;
    color: var(--text-soft);
    margin-bottom: 26px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--floor);
  }

  .panel-section {
    margin-bottom: 26px;
  }

  .panel-section h4 {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    margin: 0 0 10px 0;
    letter-spacing: 0.08em;
  }

  .panel-status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    margin-bottom: 4px;
  }

  .panel-status-row .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .progress-track {
    width: 100%;
    height: 6px;
    background: var(--floor);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 8px;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
  }

  .progress-pct {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 6px;
  }

  .task-item {
    font-size: 13px;
    padding: 8px 0;
    border-bottom: 1px solid var(--floor);
  }

  .task-item:last-child { border-bottom: none; }

  .task-item .task-time {
    display: block;
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 2px;
  }

  .empty-hint {
    position: fixed;
    bottom: 28px;
    left: calc(50% - 190px);
    transform: translateX(-50%);
    font-size: 11.5px;
    letter-spacing: 0.02em;
    color: var(--text-soft);
    background: #FFFDFA;
    padding: 8px 18px;
    border: 1px solid var(--wall);
    border-radius: 20px;
    box-shadow: 0 4px 14px rgba(47,74,107,0.08);
  }

  /* ---- チャットパネル（常設・右端） ---- */
  .chat-panel {
    position: fixed;
    top: 72px;
    right: 0;
    width: 380px;
    height: calc(100vh - 72px);
    background: #FFFDFA;
    border-left: 1px solid var(--wall);
    box-shadow: -14px 0 36px rgba(47,74,107,0.06);
    display: flex;
    flex-direction: column;
    z-index: 15;
  }

  .chat-header {
    padding: 22px 22px 16px;
    border-bottom: 1px solid var(--floor-line);
  }

  .chat-header h3 {
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 12px 0;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  .chat-recipient-select {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .recipient-chip {
    font-size: 12px;
    padding: 6px 12px;
    border: 1px solid var(--wall);
    border-radius: 14px;
    background: #fff;
    color: var(--text-soft);
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }

  .recipient-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .recipient-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .chat-key-area {
    padding: 14px 22px;
    border-bottom: 1px solid var(--floor-line);
    background: var(--zone-finance);
  }

  .chat-key-area label {
    display: block;
    font-size: 10.5px;
    color: var(--text-soft);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }

  .chat-key-row {
    display: flex;
    gap: 6px;
  }

  .chat-key-row input {
    flex: 1;
    font-size: 12px;
    padding: 7px 10px;
    border: 1px solid var(--wall);
    border-radius: 4px;
    background: #fff;
    color: var(--text);
    font-family: inherit;
  }

  .chat-key-row input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .chat-key-hint {
    font-size: 10.5px;
    color: var(--text-soft);
    margin-top: 6px;
    line-height: 1.5;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .chat-msg {
    max-width: 88%;
    font-size: 13px;
    line-height: 1.6;
    padding: 10px 13px;
    border-radius: 10px;
    white-space: pre-wrap;
  }

  .chat-msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 3px;
  }

  .chat-msg.ai {
    align-self: flex-start;
    background: var(--zone-content);
    color: var(--text);
    border-bottom-left-radius: 3px;
  }

  .chat-msg.system {
    align-self: center;
    background: transparent;
    color: var(--text-soft);
    font-size: 11.5px;
    text-align: center;
    max-width: 100%;
  }

  .chat-msg-name {
    display: block;
    font-size: 10.5px;
    color: var(--text-soft);
    margin-bottom: 3px;
    letter-spacing: 0.02em;
  }

  .chat-input-area {
    padding: 16px 22px 20px;
    border-top: 1px solid var(--floor-line);
  }

  .chat-input-row {
    display: flex;
    gap: 8px;
  }

  .chat-input-row textarea {
    flex: 1;
    resize: none;
    font-size: 13px;
    font-family: inherit;
    padding: 10px 12px;
    border: 1px solid var(--wall);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    height: 42px;
    line-height: 1.4;
  }

  .chat-input-row textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .chat-send-btn {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    transition: background 0.15s ease;
  }

  .chat-send-btn:hover {
    background: #253d5a;
  }

  .chat-send-btn:disabled {
    background: var(--wall);
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="header">
  <div class="title-block">
    <div class="title">Study Route A.C.A.</div>
    <div class="subtitle">運営オフィス — 社内専用</div>
  </div>
  <div class="date" id="today"></div>
</div>

<div class="chat-panel">
  <div class="chat-header">
    <h3>社員チャット</h3>
    <div class="chat-recipient-select" id="recipientSelect"></div>
  </div>

  <div class="chat-key-area">
    <label>Gemini API キー</label>
    <div class="chat-key-row">
      <input type="password" id="apiKeyInput" placeholder="AIza... を入力">
    </div>
    <div class="chat-key-hint">送信のたびに使用します。保存はされません。<a href="https://aistudio.google.com/apikey" target="_blank" style="color:var(--accent)">キーの取得はこちら</a></div>
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="chat-input-area">
    <div class="chat-input-row">
      <textarea id="chatInput" placeholder="メッセージを入力..."></textarea>
      <button class="chat-send-btn" id="sendBtn" onclick="sendChatMessage()">→</button>
    </div>
  </div>
</div>

<div class="office-wrap">
  <div class="office" id="office"></div>
</div>

<div class="panel" id="panel">
  <button class="panel-close" onclick="closePanel()">✕</button>
  <div id="panelContent"></div>
</div>

<div class="empty-hint">社員のアイコンをクリックすると詳細が表示されます</div>

<script>
const today = new Date();
document.getElementById('today').textContent =
  today.getFullYear() + '年' + (today.getMonth()+1) + '月' + today.getDate() + '日';

// ---- 部署ゾーン定義（オフィス平面図の区画） ----
const zones = [
  { id: 'marketing', label: 'マーケティング部', x: 24,  y: 60,  w: 260, h: 220 },
  { id: 'content',   label: '教材開発部',       x: 300, y: 60,  w: 260, h: 220 },
  { id: 'finance',   label: '経理部',           x: 24,  y: 300, w: 260, h: 220 },
  { id: 'support',   label: '広報・カスタマー部', x: 300, y: 300, w: 260, h: 220 },
];

// ---- 社員データ（ダミー。後で note / GitHub 等の実データに接続予定） ----
const staff = [
  {
    id: 'm1', name: '桜庭 陽菜', dept: 'marketing', role: 'マーケティング部 担当AI社員',
    x: 90, y: 130, status: 'working',
    progress: 62,
    currentTask: 'note新着記事の告知文を作成中',
    tasks: [
      { text: 'YouTube動画の概要欄を作成', time: '今日 09:12' },
      { text: 'Xの投稿文を3案作成', time: '今日 08:40' },
      { text: '先週のnote閲覧数を集計', time: '昨日 18:20' },
    ],
    note: 'SNS・note発信のトーンをチームの雰囲気に合わせて調整中。',
    systemPrompt: 'あなたは「桜庭陽菜」、Study Route A.C.A.（航空大学校受験対策の教材・情報発信チーム）のマーケティング部担当AI社員です。note記事の告知文、SNS投稿文、YouTube概要欄など、発信まわりの相談に乗ってください。丁寧で前向きな話し方、ただし馴れ馴れしすぎない敬語で答えてください。'
  },
  {
    id: 'c1', name: '結城 蒼', dept: 'content', role: '教材開発部 担当AI社員',
    x: 370, y: 130, status: 'working',
    progress: 40,
    currentTask: '航空大学校 物理過去問の解説ドラフトを作成中',
    tasks: [
      { text: '数学 大問3の類題を2問作成', time: '今日 10:05' },
      { text: '英語頻出語句リストを更新', time: '今日 07:50' },
      { text: '地学分野の出題傾向を分析', time: '昨日 20:10' },
    ],
    note: '英語Section IIの語彙対策を優先タスクとして進行中。',
    systemPrompt: 'あなたは「結城蒼」、Study Route A.C.A.（航空大学校受験対策の教材・情報発信チーム）の教材開発部担当AI社員です。過去問分析、問題作成、解答解説の相談に乗ってください。正確さを重視し、落ち着いた丁寧な敬語で答えてください。'
  },
  {
    id: 'f1', name: '早坂 律', dept: 'finance', role: '経理部 担当AI社員',
    x: 90, y: 370, status: 'waiting',
    progress: 85,
    currentTask: '今月のnote売上レポート、承認待ち',
    tasks: [
      { text: '教材別の売上を集計', time: '今日 06:30' },
      { text: '前月比のグラフを作成', time: '昨日 22:00' },
    ],
    note: '月次レポートは作成済み。CPOの確認待ちの状態。',
    systemPrompt: 'あなたは「早坂律」、Study Route A.C.A.（航空大学校受験対策の教材・情報発信チーム）の経理部担当AI社員です。売上整理、データ集計、レポート作成の相談に乗ってください。数字に基づいた簡潔で正確な受け答えを心がけ、丁寧な敬語で答えてください。'
  },
  {
    id: 's1', name: '深町 澪', dept: 'support', role: '広報・カスタマー部 担当AI社員',
    x: 370, y: 370, status: 'done',
    progress: 100,
    currentTask: '本日分の問い合わせ、対応完了',
    tasks: [
      { text: '問い合わせフォームの内容を分類', time: '今日 11:00' },
      { text: '返信文のドラフトを2件作成', time: '今日 10:20' },
      { text: 'お知らせ欄の文言を更新', time: '昨日 19:40' },
    ],
    note: '問い合わせ0件〜数件/日を想定。返信は下書きまで、送信前にCPOが確認。',
    systemPrompt: 'あなたは「深町澪」、Study Route A.C.A.（航空大学校受験対策の教材・情報発信チーム）の広報・カスタマー部担当AI社員です。問い合わせ対応の下書き、お知らせ文の作成の相談に乗ってください。相手への配慮が伝わる、温かみのある丁寧な敬語で答えてください。'
  },
];

const statusLabel = { working: '作業中', waiting: '確認待ち', done: '完了' };

const office = document.getElementById('office');

// ゾーン描画
zones.forEach(z => {
  const div = document.createElement('div');
  div.className = 'zone ' + z.id;
  div.style.left = z.x + 'px';
  div.style.top = z.y + 'px';
  div.style.width = z.w + 'px';
  div.style.height = z.h + 'px';
  const label = document.createElement('div');
  label.className = 'zone-label';
  label.textContent = z.label;
  div.appendChild(label);
  office.appendChild(div);
});

// CPO席（中央下）
const cpo = document.createElement('div');
cpo.className = 'cpo-desk';
cpo.style.left = '395px';
cpo.style.top = '560px';
const cpoLabel = document.createElement('div');
cpoLabel.className = 'cpo-label';
cpoLabel.textContent = 'CPO席（あなた）';

// 社員デスク描画
staff.forEach(s => {
  const desk = document.createElement('div');
  desk.className = 'desk';
  desk.style.left = s.x + 'px';
  desk.style.top = s.y + 'px';

  const person = document.createElement('div');
  person.className = 'staff';
  person.id = 'staff-' + s.id;
  person.textContent = s.name[0];
  person.onclick = () => openPanel(s.id);

  const dot = document.createElement('div');
  dot.className = 'status-dot ' + s.status;
  person.appendChild(dot);

  const nameTag = document.createElement('div');
  nameTag.className = 'desk-name';
  nameTag.textContent = s.name;

  desk.appendChild(person);
  desk.appendChild(nameTag);
  office.appendChild(desk);
});

function openPanel(id) {
  const s = staff.find(x => x.id === id);
  document.querySelectorAll('.staff').forEach(el => el.classList.remove('selected'));
  document.getElementById('staff-' + id).classList.add('selected');

  const dotColor = { working: 'var(--ok)', waiting: 'var(--warn)', done: 'var(--text-soft)' }[s.status];

  document.getElementById('panelContent').innerHTML = `
    <div class="panel-avatar">${s.name[0]}</div>
    <div class="panel-name">${s.name}</div>
    <div class="panel-role">${s.role}</div>

    <div class="panel-section">
      <h4>ステータス</h4>
      <div class="panel-status-row">
        <div class="dot" style="background:${dotColor}"></div>
        ${statusLabel[s.status]} — ${s.currentTask}
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${s.progress}%"></div></div>
      <div class="progress-pct">進捗 ${s.progress}%</div>
    </div>

    <div class="panel-section">
      <h4>最近の作業ログ</h4>
      ${s.tasks.map(t => `
        <div class="task-item">
          ${t.text}
          <span class="task-time">${t.time}</span>
        </div>
      `).join('')}
    </div>

    <div class="panel-section">
      <h4>メモ</h4>
      <div style="font-size:13px; line-height:1.6; color:var(--text)">${s.note}</div>
    </div>
  `;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  document.querySelectorAll('.staff').forEach(el => el.classList.remove('selected'));
}

/* ---- チャット機能 ---- */
let currentRecipientId = staff[0].id;
const chatHistories = {}; // { staffId: [{role: 'user'|'model', text: ''}] }
staff.forEach(s => chatHistories[s.id] = []);

const recipientSelect = document.getElementById('recipientSelect');
staff.forEach(s => {
  const chip = document.createElement('div');
  chip.className = 'recipient-chip' + (s.id === currentRecipientId ? ' active' : '');
  chip.textContent = s.name;
  chip.onclick = () => switchRecipient(s.id);
  chip.id = 'chip-' + s.id;
  recipientSelect.appendChild(chip);
});

function switchRecipient(id) {
  currentRecipientId = id;
  document.querySelectorAll('.recipient-chip').forEach(c => c.classList.remove('active'));
  document.getElementById('chip-' + id).classList.add('active');
  renderChatMessages();
}

function renderChatMessages() {
  const container = document.getElementById('chatMessages');
  const history = chatHistories[currentRecipientId];
  const s = staff.find(x => x.id === currentRecipientId);

  if (history.length === 0) {
    container.innerHTML = `<div class="chat-msg system">${s.name}さんとのチャットです。メッセージを送ってみてください。</div>`;
    return;
  }

  container.innerHTML = history.map(m => {
    if (m.role === 'user') {
      return `<div class="chat-msg user">${escapeHtml(m.text)}</div>`;
    } else if (m.role === 'model') {
      return `<div class="chat-msg ai"><span class="chat-msg-name">${s.name}</span>${escapeHtml(m.text)}</div>`;
    } else {
      return `<div class="chat-msg system">${escapeHtml(m.text)}</div>`;
    }
  }).join('');
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

renderChatMessages();

async function sendChatMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  const apiKey = document.getElementById('apiKeyInput').value.trim();
  if (!apiKey) {
    alert('Gemini APIキーを入力してください。');
    return;
  }

  const s = staff.find(x => x.id === currentRecipientId);
  const history = chatHistories[currentRecipientId];

  history.push({ role: 'user', text });
  input.value = '';
  renderChatMessages();

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  // 「考え中」の一時表示
  const container = document.getElementById('chatMessages');
  const thinkingEl = document.createElement('div');
  thinkingEl.className = 'chat-msg system';
  thinkingEl.textContent = `${s.name}さんが入力中...`;
  thinkingEl.id = 'thinking-indicator';
  container.appendChild(thinkingEl);
  container.scrollTop = container.scrollHeight;

  try {
    const contents = history
      .filter(m => m.role === 'user' || m.role === 'model')
      .map(m => ({ role: m.role, parts: [{ text: m.text }] }));

    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: s.systemPrompt }] },
          contents: contents
        })
      }
    );

    const data = await response.json();

    const thinking = document.getElementById('thinking-indicator');
    if (thinking) thinking.remove();

    if (!response.ok) {
      const errMsg = data?.error?.message || '不明なエラーが発生しました。';
      history.push({ role: 'system', text: 'エラー: ' + errMsg });
      renderChatMessages();
      return;
    }

    const replyText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '（応答を取得できませんでした）';
    history.push({ role: 'model', text: replyText });
    renderChatMessages();

  } catch (err) {
    const thinking = document.getElementById('thinking-indicator');
    if (thinking) thinking.remove();
    history.push({ role: 'system', text: '通信エラーが発生しました。APIキーやネットワークをご確認ください。' });
    renderChatMessages();
  } finally {
    sendBtn.disabled = false;
  }
}

// Enterで送信（Shift+Enterは改行）
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage();
  }
});
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Route A.C.A. — 運営オフィス</title>
<style>
  :root {
    --bg: #F5F3EE;
    --bg-grad-a: #F7F4EE;
    --bg-grad-b: #EEEAE1;
    --floor: #EFEAE0;
    --floor-line: #E0D9CB;
    --wall: #CBC2AF;
    --desk: #FFFDF9;
    --desk-border: #C4B9A3;
    --accent: #2F4A6B;
    --accent-soft: #E1E9F1;
    --accent-2: #B5673C;
    --accent-2-soft: #F3E3D6;
    --text: #26241E;
    --text-soft: #85806F;
    --ok: #4F7A5C;
    --warn: #B98A3B;
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", serif;

    --zone-marketing: #F7EFE3;
    --zone-content: #EAF0EC;
    --zone-finance: #EBEEF3;
    --zone-support: #F5EAE7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background:
      radial-gradient(ellipse 1200px 700px at 15% -10%, rgba(181,103,60,0.06), transparent),
      radial-gradient(ellipse 1000px 800px at 100% 110%, rgba(47,74,107,0.07), transparent),
      linear-gradient(160deg, var(--bg-grad-a), var(--bg-grad-b));
    background-attachment: fixed;
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    letter-spacing: 0.01em;
    height: 100%;
    overflow: hidden;
  }

  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&display=swap');

  .app {
    display: flex;
    height: 100vh;
  }

  /* ---- ヘッダー ---- */
  .header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 36px;
    background: rgba(247,244,238,0.82);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--wall);
    z-index: 20;
  }

  .header .title-block {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .header .title {
    font-family: var(--serif);
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .header .subtitle {
    color: var(--text-soft);
    font-weight: 400;
    font-size: 12px;
    letter-spacing: 0.03em;
    padding-left: 14px;
    border-left: 1px solid var(--wall);
  }

  .header .date {
    font-size: 12px;
    color: var(--text-soft);
    letter-spacing: 0.02em;
  }

  /* ---- メインエリア（オフィス平面図） ---- */
  .office-wrap {
    flex: 1;
    margin-top: 72px;
    margin-right: 380px;
    height: calc(100vh - 72px);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 48px;
  }

  .office {
    position: relative;
    width: 920px;
    height: 640px;
    background:
      linear-gradient(var(--floor-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--floor-line) 1px, transparent 1px),
      var(--floor);
    background-size: 40px 40px, 40px 40px, 100% 100%;
    background-position: -1px -1px;
    border: 1px solid var(--wall);
    border-radius: 2px;
    box-shadow:
      0 1px 2px rgba(36,35,31,0.05),
      0 20px 48px rgba(47,74,107,0.09);
    flex-shrink: 0;
  }

  /* 部署エリアの区切り線 */
  .zone {
    position: absolute;
    border: 1px solid var(--wall);
    border-radius: 2px;
    background: rgba(255,255,255,0.4);
  }

  .zone.marketing { background: var(--zone-marketing); }
  .zone.content   { background: var(--zone-content); }
  .zone.finance   { background: var(--zone-finance); }
  .zone.support   { background: var(--zone-support); }

  .zone-label {
    position: absolute;
    top: 12px;
    left: 16px;
    font-family: var(--serif);
    font-size: 12.5px;
    color: var(--text);
    font-weight: 600;
    letter-spacing: 0.06em;
  }

  .zone-label::after {
    content: "";
    display: block;
    width: 20px;
    height: 1px;
    background: var(--accent);
    margin-top: 6px;
    opacity: 0.5;
  }

  /* デスク */
  .desk {
    position: absolute;
    width: 112px;
    height: 62px;
    background: var(--desk);
    border: 1px solid var(--desk-border);
    border-radius: 2px;
    box-shadow:
      0 2px 4px rgba(36,35,31,0.05),
      0 6px 14px rgba(36,35,31,0.05);
  }

  .desk::after {
    /* 天板の奥行きライン */
    content: "";
    position: absolute;
    left: 8px;
    right: 8px;
    top: 8px;
    height: 1px;
    background: var(--floor-line);
  }

  .desk::before {
    /* 椅子 */
    content: "";
    position: absolute;
    width: 28px;
    height: 20px;
    background: var(--wall);
    border-radius: 4px;
    bottom: -24px;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0.45;
  }

  .staff {
    position: absolute;
    top: -17px;
    left: 50%;
    transform: translateX(-50%);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent-soft);
    border: 1.5px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    user-select: none;
    box-shadow: 0 2px 6px rgba(36,35,31,0.08);
  }

  .staff:hover {
    transform: translateX(-50%) scale(1.08);
    box-shadow: 0 4px 14px rgba(47,74,107,0.22);
  }

  .staff.selected {
    box-shadow: 0 0 0 4px rgba(47,74,107,0.15), 0 4px 14px rgba(47,74,107,0.22);
  }

  .status-dot {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    border: 2px solid var(--floor);
  }

  .status-dot.working { background: var(--ok); }
  .status-dot.waiting { background: var(--warn); }
  .status-dot.done { background: var(--text-soft); }

  .desk-name {
    position: absolute;
    bottom: -42px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--text-soft);
    white-space: nowrap;
  }

  /* CPO席 */
  .cpo-desk {
    position: absolute;
    width: 130px;
    height: 74px;
    background: var(--desk);
    border: 1.5px solid var(--accent-2);
    border-radius: 4px;
    box-shadow:
      0 2px 4px rgba(36,35,31,0.05),
      0 8px 18px rgba(181,103,60,0.12);
  }

  .cpo-label {
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent-2);
    color: white;
    font-family: var(--serif);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 4px 12px;
    border-radius: 2px;
    white-space: nowrap;
  }

  /* ---- サイドパネル ---- */
  .panel {
    position: fixed;
    top: 72px;
    right: 380px;
    width: 340px;
    height: calc(100vh - 72px);
    background: #FFFDFA;
    border-left: 1px solid var(--wall);
    box-shadow: -16px 0 40px rgba(47,74,107,0.08);
    transform: translateX(100%);
    opacity: 0;
    visibility: hidden;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease, visibility 0s linear 0.28s;
    z-index: 25;
    padding: 34px 30px;
    overflow-y: auto;
  }

  .panel.open {
    transform: translateX(0);
    opacity: 1;
    visibility: visible;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease, visibility 0s linear 0s;
  }

  .panel-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: none;
    font-size: 18px;
    color: var(--text-soft);
    cursor: pointer;
    line-height: 1;
  }

  .panel-avatar {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--accent-soft);
    border: 1.5px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 16px;
  }

  .panel-name {
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }

  .panel-role {
    font-size: 12.5px;
    color: var(--text-soft);
    margin-bottom: 26px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--floor);
  }

  .panel-section {
    margin-bottom: 26px;
  }

  .panel-section h4 {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    margin: 0 0 10px 0;
    letter-spacing: 0.08em;
  }

  .panel-status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    margin-bottom: 4px;
  }

  .panel-status-row .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .progress-track {
    width: 100%;
    height: 6px;
    background: var(--floor);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 8px;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
  }

  .progress-pct {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 6px;
  }

  .task-item {
    font-size: 13px;
    padding: 8px 0;
    border-bottom: 1px solid var(--floor);
  }

  .task-item:last-child { border-bottom: none; }

  .task-item .task-time {
    display: block;
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 2px;
  }

  .empty-hint {
    position: fixed;
    bottom: 28px;
    left: calc(50% - 190px);
    transform: translateX(-50%);
    font-size: 11.5px;
    letter-spacing: 0.02em;
    color: var(--text-soft);
    background: #FFFDFA;
    padding: 8px 18px;
    border: 1px solid var(--wall);
    border-radius: 20px;
    box-shadow: 0 4px 14px rgba(47,74,107,0.08);
  }

  /* ---- チャットパネル（常設・右端） ---- */
  .chat-panel {
    position: fixed;
    top: 72px;
    right: 0;
    width: 380px;
    height: calc(100vh - 72px);
    background: #FFFDFA;
    border-left: 1px solid var(--wall);
    box-shadow: -14px 0 36px rgba(47,74,107,0.06);
    display: flex;
    flex-direction: column;
    z-index: 15;
  }

  .chat-header {
    padding: 22px 22px 16px;
    border-bottom: 1px solid var(--floor-line);
  }

  .chat-header h3 {
    font-family: var(--serif);
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 12px 0;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  .chat-recipient-select {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .recipient-chip {
    font-size: 12px;
    padding: 6px 12px;
    border: 1px solid var(--wall);
    border-radius: 14px;
    background: #fff;
    color: var(--text-soft);
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }

  .recipient-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .recipient-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .chat-key-area {
    padding: 14px 22px;
    border-bottom: 1px solid var(--floor-line);
    background: var(--zone-finance);
  }

  .chat-key-area label {
    display: block;
    font-size: 10.5px;
    color: var(--text-soft);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }

  .chat-key-row {
    display: flex;
    gap: 6px;
  }

  .chat-key-row input {
    flex: 1;
    font-size: 12px;
    padding: 7px 10px;
    border: 1px solid var(--wall);
    border-radius: 4px;
    background: #fff;
    color: var(--text);
    font-family: inherit;
  }

  .chat-key-row input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .chat-key-hint {
    font-size: 10.5px;
    color: var(--text-soft);
    margin-top: 6px;
    line-height: 1.5;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .chat-msg {
    max-width: 88%;
    font-size: 13px;
    line-height: 1.6;
    padding: 10px 13px;
    border-radius: 10px;
    white-space: pre-wrap;
  }

  .chat-msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 3px;
  }

  .chat-msg.ai {
    align-self: flex-start;
    background: var(--zone-content);
    color: var(--text);
    border-bottom-left-radius: 3px;
  }

  .chat-msg.system {
    align-self: center;
    background: transparent;
    color: var(--text-soft);
    font-size: 11.5px;
    text-align: center;
    max-width: 100%;
  }

  .chat-msg-name {
    display: block;
    font-size: 10.5px;
    color: var(--text-soft);
    margin-bottom: 3px;
    letter-spacing: 0.02em;
  }

  .chat-input-area {
    padding: 16px 22px 20px;
    border-top: 1px solid var(--floor-line);
  }

  .chat-input-row {
    display: flex;
    gap: 8px;
  }

  .chat-input-row textarea {
    flex: 1;
    resize: none;
    font-size: 13px;
    font-family: inherit;
    padding: 10px 12px;
    border: 1px solid var(--wall);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
    height: 42px;
    line-height: 1.4;
  }

  .chat-input-row textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .chat-send-btn {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    transition: background 0.15s ease;
  }

  .chat-send-btn:hover {
    background: #253d5a;
  }

  .chat-send-btn:disabled {
    background: var(--wall);
    cursor: not-allowed;
  }

  /* WebLLM and collapsible chat */
  .model-status-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}.model-status-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex-shrink:0}.model-status-dot.ready{background:var(--ok)}.model-status-dot.error{background:#9b4c43}.model-load-btn{width:100%;padding:9px 12px;border:0;border-radius:5px;background:var(--accent);color:#fff;font-family:inherit;cursor:pointer}.model-load-btn:disabled{background:var(--wall);cursor:not-allowed}.model-progress{width:100%;height:6px;background:var(--floor);border-radius:3px;overflow:hidden;margin-top:9px}.model-progress-fill{width:0;height:100%;background:var(--accent);transition:width .2s ease}
  .chat-panel{transition:transform .28s cubic-bezier(.22,1,.36,1),visibility 0s}.chat-panel.closed{transform:translateX(100%);visibility:hidden}.office-wrap{transition:margin-right .28s cubic-bezier(.22,1,.36,1)}body.chat-closed .office-wrap{margin-right:0}body.chat-closed .panel{right:0}body.chat-closed .empty-hint{left:50%}.chat-toggle-btn{position:fixed;top:84px;right:392px;z-index:40;border:0;border-radius:5px;padding:9px 12px;background:var(--accent);color:#fff;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 5px 16px rgba(47,74,107,.2);transition:right .28s,background .15s}body.chat-closed .chat-toggle-btn{right:14px}
  .panel-close{left:20px!important;right:auto!important;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:#FFFDFA!important;border:1px solid var(--wall)!important;border-radius:50%;box-shadow:0 4px 12px rgba(47,74,107,.1)}.panel-avatar{margin-left:48px}
  @media(max-width:760px){.chat-panel{width:min(380px,100vw)}.office-wrap{margin-right:0;padding:24px}.panel{right:0;width:min(340px,100vw)}.chat-toggle-btn,body.chat-closed .chat-toggle-btn{right:14px}.empty-hint{display:none}}

  /* ---- Official website knowledge (hidden, automatic) ---- */
  .site-knowledge-area{display:none!important}
  .site-knowledge-area{margin-top:14px;padding-top:12px;border-top:1px solid var(--floor-line)}
  .site-knowledge-area label{display:block;margin-bottom:6px;font-size:10.5px;color:var(--text-soft)}
  .site-url-row{display:flex;gap:6px}.site-url-row input{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--wall);border-radius:4px;background:#fff;color:var(--text);font-family:inherit;font-size:11px}.site-url-row input:focus{outline:none;border-color:var(--accent)}
  .site-url-row button{flex-shrink:0;padding:7px 10px;border:0;border-radius:4px;background:var(--accent);color:#fff;font-family:inherit;font-size:11px;cursor:pointer}.site-url-row button:disabled{background:var(--wall);cursor:not-allowed}
  .site-load-status{margin-top:6px;color:var(--text-soft);font-size:10.5px;line-height:1.5}.site-load-status.success{color:var(--ok)}.site-load-status.error{color:#9b4c43}
</style>
</head>
<body>
<button type="button" class="chat-toggle-btn" id="chatToggleBtn" onclick="toggleChatPanel()" aria-controls="chatPanel" aria-expanded="true">チャットを閉じる ›</button>

<div class="header">
  <div class="title-block">
    <div class="title">Study Route A.C.A.</div>
    <div class="subtitle">運営オフィス — 社内専用</div>
  </div>
  <div class="date" id="today"></div>
</div>

<div class="chat-panel" id="chatPanel">
  <div class="chat-header">
    <h3>社員チャット</h3>
    <div class="chat-recipient-select" id="recipientSelect"></div>
  </div>

  <div class="chat-key-area"><div class="model-status-row"><span class="model-status-dot" id="modelStatusDot"></span><strong style="font-size:12px">ブラウザ内AI</strong></div><button type="button" class="model-load-btn" id="loadModelBtn" onclick="loadLocalModel()">AI社員を起動</button><div class="model-progress"><div class="model-progress-fill" id="modelProgress"></div></div><div class="chat-key-hint" id="modelStatus">初回のみAIモデルをダウンロードします。アカウント・APIキー・利用料金は不要です。</div>
    <div class="site-knowledge-area">
      <label for="siteUrlInput">公式サイトURL</label>
      <div class="site-url-row"><input type="url" id="siteUrlInput" value="https://studyroute-aca.github.io/" placeholder="https://..."><button type="button" id="loadSiteBtn" onclick="loadWebsiteKnowledge()">読み込む</button></div>
      <div class="site-load-status" id="siteLoadStatus">ページ表示後に公式サイトを自動で読み込みます。</div>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="chat-input-area">
    <div class="chat-input-row">
      <textarea id="chatInput" placeholder="メッセージを入力..."></textarea>
      <button class="chat-send-btn" id="sendBtn" onclick="sendChatMessage()">→</button>
    </div>
  </div>
</div>

<div class="office-wrap">
  <div class="office" id="office"></div>
</div>

<div class="panel" id="panel">
  <button class="panel-close" onclick="closePanel()">✕</button>
  <div id="panelContent"></div>
</div>

<div class="empty-hint">社員のアイコンをクリックすると詳細が表示されます</div>

<script>
const today = new Date();
document.getElementById('today').textContent =
  today.getFullYear() + '年' + (today.getMonth()+1) + '月' + today.getDate() + '日';

// ---- 部署ゾーン定義（オフィス平面図の区画） ----
const zones = [
  { id: 'marketing', label: 'マーケティング部', x: 24,  y: 60,  w: 260, h: 220 },
  { id: 'content',   label: '教材開発部',       x: 300, y: 60,  w: 260, h: 220 },
  { id: 'finance',   label: '経理部',           x: 24,  y: 300, w: 260, h: 220 },
  { id: 'support',   label: '広報・カスタマー部', x: 300, y: 300, w: 260, h: 220 },
];

// ---- 社員データ（ダミー。後で note / GitHub 等の実データに接続予定） ----
const staff = [
  {
    id: 'm1', name: '桜庭 陽菜', dept: 'marketing', role: 'マーケティング部 担当AI社員',
    x: 90, y: 130, status: 'working',
    progress: 62,
    currentTask: 'note新着記事の告知文を作成中',
    tasks: [
      { text: 'YouTube動画の概要欄を作成', time: '今日 09:12' },
      { text: 'Xの投稿文を3案作成', time: '今日 08:40' },
      { text: '先週のnote閲覧数を集計', time: '昨日 18:20' },

const STATE_KEY = 'office_staff_state';
function loadStaffState() {
  try {

        s.status = saved[s.id].status ?? s.status;
        s.progress = saved[s.id].progress ?? s.progress;
        s.currentTask = saved[s.id].currentTask ?? s.currentTask;
        s.tasks = saved[s.id].tasks ?? s.tasks;
        s.note = saved[s.id].note ?? s.note;
      }
    });

function saveStaffState() {
  const toSave = {};
  staff.forEach(s => {
    toSave[s.id] = {
      status: s.status,
      progress: s.progress,
      currentTask: s.currentTask,
      tasks: s.tasks,
      note: s.note

function nowLabel() {
  const d = new Date();
  return `今日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function addTaskLog(staffId, text) {
  const s = staff.find(x => x.id === staffId);
  if (!s) return;
  s.tasks.unshift({ text, time: nowLabel() });
  s.tasks = s.tasks.slice(0, 8); // 直近8件まで保持
  s.currentTask = text;
  saveStaffState();
}

function updateProgress(staffId, progress, status) {
  const s = staff.find(x => x.id === staffId);
  if (!s) return;
  if (typeof progress === 'number') s.progress = Math.max(0, Math.min(100, progress));
  if (status) s.status = status;
  saveStaffState();
  refreshDeskDot(staffId);
  if (currentRecipientId === staffId && document.getElementById('panel').classList.contains('open')) {
    openPanel(staffId); // パネルが開いていれば再描画
  }
}

function renderChatMessages() {
  const container = document.getElementById('chatMessages');
  const history = chatHistories[currentRecipientId];
  const s = staff.find(x => x.id === currentRecipientId);

  if (history.length === 0) {
    container.innerHTML = `<div class="chat-msg system">${s.name}さんとのチャットです。メッセージを送ってみてください。</div>`;
    return;
  }

  container.innerHTML = history.map(m => {
    if (m.role === 'user') {
      return `<div class="chat-msg user">${escapeHtml(m.text)}</div>`;
    } else if (m.role === 'model') {
      return `<div class="chat-msg ai"><span class="chat-msg-name">${s.name}</span>${escapeHtml(m.text)}</div>`;
    } else {
      return `<div class="chat-msg system">${escapeHtml(m.text)}</div>`;
    }
  }).join('');
  container.scrollTop = container.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function loadWebsiteKnowledge(){

    const main=doc.querySelector('main')||doc.querySelector('article')||doc.body;
    const content=String(main?.innerText||'').replace(/\r/g,'').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim().slice(0,15000);
    if(content.length<50)throw new Error('読み取れる本文がありません');

  finally{button.disabled=false;button.textContent='読み込む'}
}
function buildWebsiteContext(query){
  if(!websiteKnowledge.content)return '';
  const synonyms={'会社':['事業','運営','組織','プロジェクト'],'目標':['理念','目的','ビジョン','方針','将来'],'商品':['教材','サービス','コンテンツ','販売'],'料金':['価格','金額','値段','費用'],'勉強':['学習','対策','受験'],'航空大学校':['航大','航空大','受験対策'],'問い合わせ':['連絡','質問','サポート','相談'],'youtube':['動画','チャンネル','配信'],'note':['記事','投稿','教材販売']};
  const companyWords=['study route','aca','会社','事業','運営','理念','目標','サービス','商品','教材','料金','価格','航空大学校','航大','公式サイト','問い合わせ','youtube','note'];
  const normalized=String(query).toLowerCase();
  if(!companyWords.some(word=>normalized.includes(word)))return '';
  const expanded=new Set(normalized.split(/[\\s、。・「」『』（）()！？!?]+/).filter(w=>w.length>=2));
  for(const [key,values] of Object.entries(synonyms)){if(normalized.includes(key)||values.some(v=>normalized.includes(v))){expanded.add(key);values.forEach(v=>expanded.add(v));}}
  const matches=websiteKnowledge.content.split(/\\n{2,}/).filter(x=>x.trim().length>=20).map(text=>{const lower=text.toLowerCase();let score=0;expanded.forEach(word=>{if(lower.includes(word))score+=word.length>=4?3:2;});return{text,score};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
  if(!matches.length)return '【公式サイト情報】\\n質問に関連する記載は公式サイト本文から見つかりませんでした。会社情報を推測しないでください。';
  const reference=matches.map(x=>x.text).join('\\n\\n').slice(0,3000);
  return `【公式サイト情報】\\nサイト名: ${websiteKnowledge.title}\\nURL: ${websiteKnowledge.url}\\n\\n${reference}\\n\\n【利用ルール】公式サイトの記載を優先し、記載のない会社情報を作らないでください。確認できない場合は「公式サイトでは確認できません」と回答してください。`;
}

const savedPanelState=localStorage.getItem(CHAT_PANEL_STATE_KEY);setChatPanelState(savedPanelState===null?true:savedPanelState==='true');
window.addEventListener('load',async()=>{const saved=localStorage.getItem(SITE_URL_STORAGE_KEY);if(saved)document.getElementById('siteUrlInput').value=saved;await loadWebsiteKnowledge();setTimeout(loadLocalModel,700)});
window.loadWebsiteKnowledge=loadWebsiteKnowledge;window.loadLocalModel=loadLocalModel;window.sendChatMessage=sendChatMessage;window.toggleChatPanel=toggleChatPanel;
</script>

</body>
</html>
